<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <title>Pucuxz28 - Payment & Links</title>
    <style>
        /* Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a; /* Warna latar belakang gelap seperti video */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Container Utama (Kotak Biru) */
        .container {
            width: 100%;
            max-width: 400px;
            background-color: #2563eb; /* Warna biru khas HeyLink */
            border-radius: 12px;
            padding: 25px 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Profil */
        .profile-section {
            margin-bottom: 20px;
        }

        .profile-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #1e3a8a;
            border: 3px solid #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 10px;
            color: white;
            font-weight: bold;
            font-size: 24px;
            overflow: hidden;
        }
        
        .profile-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-name {
            color: #ffffff;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Daftar Link (Tombol Putih) */
        .link-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-item {
            display: flex;
            align-items: center;
            background-color: #ffffff;
            padding: 12px 15px;
            border-radius: 8px;
            text-decoration: none;
            color: #1e293b;
            font-weight: 600;
            font-size: 14px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: relative;
        }

        .link-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        /* Ikon kecil di dalam tombol */
        .link-icon {
            width: 30px;
            height: 30px;
            border-radius: 4px;
            margin-right: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            color: white;
            flex-shrink: 0;
        }

        /* Warna ikon spesifik */
        .icon-dana { background-color: #118eea; }
        .icon-qris { background-color: #e11d48; }
        .icon-wa { background-color: #25d366; }
        .icon-channel { background-color: #0ea5e9; }

        /* Teks Link */
        .link-text {
            flex-grow: 1;
            text-align: left;
        }

        /* Ikon Share di kanan */
        .share-icon {
            color: #64748b;
            font-size: 16px;
            cursor: pointer;
        }

        /* Footer HeyLink */
        .footer {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
            opacity: 0.9;
        }

        .footer svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Garis pemisah tipis */
        .divider {
            height: 1px;
            background-color: rgba(255, 255, 255, 0.2);
            margin: 15px 0;
        }

        /* Bagian Judul Kecil */
        .section-title {
            color: rgba(255, 255, 255, 0.8);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            text-align: left;
            padding-left: 5px;
        }

    </style>
</head>
